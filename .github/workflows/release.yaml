name: Release SIST

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: 'x.y.z'

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    name: Version check
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      id: repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.14.6

    - name: Get latest release
      id: latestreleased
      run: |
        PREVIOUS_VERSION=$(git tag --sort=-v:refname | head -n 1)
        echo "release_tag=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
        echo "$PREVIOUS_VERSION"

    - name: version comparison
      id: compare
      run: |
        python -m pip install semver

        PREVIOUS_VERSION="${{ steps.latestreleased.outputs.release_tag }}"
        NEW_VERSION="${{ github.event.inputs.version }}"

        if [ -z "$PREVIOUS_VERSION" ]; then
          echo "No previous release found"
          exit 0
        fi

        output=$(pysemver compare "$PREVIOUS_VERSION" "$NEW_VERSION")

        if [ "$output" -ge 0 ]; then
          exit 1
        fi

  version:
    name: prepare ${{ github.event.inputs.version }}
    needs: checks
    runs-on: ubuntu-24.04
    steps:

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Change version in repo and CITATION.cff
        run: |
          # Update Conda package version
          sed -i \
            "s/{% set version = \".*\" %}/{% set version = \"${{ github.event.inputs.version }}\" %}/" \
            conda-recipe/meta.yaml

          # Update CITATION.cff version and date-released
          if [ -f CITATION.cff ]; then
            sed -i -E \
              "s/^(version:\s*).*/\1${{ github.event.inputs.version }}/" \
              CITATION.cff

            sed -i -E \
              "s/^(date-released:\s*).*/\1'$(date -u +%F)'/" \
              CITATION.cff
          fi

      - name: send PR
        id: pr_id
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update version to ${{ github.event.inputs.version }}
          branch: version-update
          title: "Update to version ${{ github.event.inputs.version }}"
          body: |
            Update version
            - Update the Conda recipe with new release
            - Update CITATION.cff version & date-released
            - Auto-generated by [CI]
          committer: version-updater <vu.bot@users.noreply.github.com>
          author: version-updater <vu.bot@users.noreply.github.com>
          base: main
          signoff: false
          draft: false

      - name: auto approve review
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          pull-request-number: ${{ steps.pr_id.outputs.pull-request-number }}
          review-message: "Auto approved version bump PR"
          github-token: ${{ secrets.AUTO_PR_MERGE }}

      - name: merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr_id.outputs.pull-request-number }}
        run: |
          gh pr merge \
            --merge \
            --delete-branch \
            --auto \
            "$PR_NUMBER"

          while true; do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')

            if [ "$STATE" = "MERGED" ]; then
              echo "Version bump PR merged"
              break
            fi

            if [ "$STATE" = "CLOSED" ]; then
              echo "Version bump PR was closed without merging"
              exit 1
            fi

            sleep 10
          done

  tag:
    name: tag release
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: tag v${{ github.event.inputs.version }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ github.event.inputs.version }}
          git push origin tag ${{ github.event.inputs.version }}

  release:
    name: make github release
    needs: tag
    runs-on: ubuntu-24.04
    steps:

      - name: create release
        id: create_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version }}

      - name: fetch generated changelog
        id: changelog
        if: steps.create_release.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # generate_release_notes builds the changelog server-side, so pull
          # it back down here rather than trying to reconstruct it locally.
          gh release view "${{ github.event.inputs.version }}" --json body -q .body > changelog.txt

      - name: notify Zulip of release
        if: steps.create_release.outcome == 'success'
        continue-on-error: true
        env:
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          REPO: ${{ github.event.repository.name }}
          TAG: v${{ github.event.inputs.version }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          CONTENT=$(cat <<EOF
          **${REPO}** [${TAG}](${RELEASE_URL}) has been released 🎉

          $(cat changelog.txt)
          EOF
          )

          curl -sSf "${ZULIP_SITE}/api/v1/messages" \
            -u "${ZULIP_BOT_EMAIL}:${ZULIP_BOT_API_KEY}" \
            --data-urlencode type=stream \
            --data-urlencode "to=announcement" \
            --data-urlencode "topic=software releases" \
            --data-urlencode "content=${CONTENT}"

  conda:
    name: publish conda to anaconda.org
    needs: [tag, release]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
        with:
          miniforge-variant: Miniforge3
          python-version: "3.14"
          auto-activate: true
          activate-environment: base
          conda-remove-defaults: true
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y \
            --override-channels \
            -c conda-forge \
            conda-build \
            anaconda-client

          conda config --set anaconda_upload no
          conda list conda-build
          conda build --help

      - name: Build package
        shell: bash -l {0}
        run: |
          PKG_PATH=$(conda build conda-recipe \
            --output \
            --override-channels \
            -c conda-forge \
            -c bioconda)

          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

          conda build conda-recipe \
            --override-channels \
            -c conda-forge \
            -c bioconda \
            --no-anaconda-upload

          test -f "$PKG_PATH"
          echo "Built: $PKG_PATH"

      - name: Upload to Anaconda
        shell: bash -l {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          anaconda \
            -t "$ANACONDA_API_TOKEN" \
            upload "$PKG_PATH" \
            --user CCPBioSim \
            --force
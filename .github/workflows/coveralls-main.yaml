name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-coverage:
    name: Build main coverage baseline (Python)
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: sist
      test-path: tests/unit
      coverage-flag: python

  cpp-coverage:
    name: Build main coverage baseline (C++)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up conda (for irf only)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-variant: Miniforge3
          auto-activate: true
          activate-environment: base
          conda-remove-defaults: true
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Install irf
        shell: bash -l {0}
        run: |
          conda install -y \
            --override-channels \
            -c bioconda \
            -c conda-forge \
            "irf>=3.09,<3.10"

      - name: Install sist
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[testing]

      - name: Build qsidd with coverage instrumentation
        run: |
          make -C src/trans_three clean
          make -C src/trans_three coverage
          make -C src/trans_compete clean
          make -C src/trans_compete coverage

      - name: Run regression tests against instrumented binaries
        shell: bash -l {0}
        env:
          CONDA_BUILD_STATE: TEST
          SIST_TRANS_THREE_BIN: ${{ github.workspace }}/src/trans_three/qsidd
          SIST_TRANS_COMPETE_BIN: ${{ github.workspace }}/src/trans_compete/qsidd
        run: python -m pytest tests/regression -vv

      - name: Upload C++ coverage
        uses: CCPBioSim/.github/actions/cpp-coverage-upload@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
        with:
          flag-name: cpp
          filters: |
            src/trans_three/.*
            src/trans_compete/.*
          gcovr-args: --gcov-ignore-parse-errors=suspicious_hits.warn

  finish:
    name: Close Coveralls build
    needs: [python-coverage, cpp-coverage]
    uses: CCPBioSim/.github/.github/workflows/ci-coveralls-finish.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read

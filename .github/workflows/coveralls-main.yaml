name: Coveralls Main

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coveralls-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-coverage:
    name: Build main coverage baseline (Python)
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: sist
      test-path: tests/unit
      coverage-flag: python

  cpp-coverage:
    name: Build main coverage baseline (C++)
    uses: CCPBioSim/.github/.github/workflows/ci-test-cpp-coverage.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      conda-packages: irf>=3.09,<3.10
      channels: conda-forge,bioconda
      build-command: |
        make -C src/trans_three clean
        make -C src/trans_three coverage
        make -C src/trans_compete clean
        make -C src/trans_compete coverage
      pre-test-command: |
        export CONDA_BUILD_STATE=TEST
        export SIST_TRANS_THREE_BIN="${GITHUB_WORKSPACE}/src/trans_three/qsidd"
        export SIST_TRANS_COMPETE_BIN="${GITHUB_WORKSPACE}/src/trans_compete/qsidd"
      test-path: tests/regression
      pytest-args: -vv
      filters: |
        src/trans_three/.*
        src/trans_compete/.*
      gcovr-args: --gcov-ignore-parse-errors=suspicious_hits.warn

  finish:
    name: Close Coveralls build
    needs: [python-coverage, cpp-coverage]
    uses: CCPBioSim/.github/.github/workflows/ci-coveralls-finish.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read

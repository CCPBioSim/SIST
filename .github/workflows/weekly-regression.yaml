name: Weekly Regression Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      channels: conda-forge,bioconda

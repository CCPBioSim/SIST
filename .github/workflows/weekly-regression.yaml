name: Weekly Regression Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      channels: conda-forge,bioconda

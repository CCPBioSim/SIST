name: Weekly Regression Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      channels: conda-forge,bioconda

name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: Pytest unit • ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel, macos-26]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[testing]

      - name: Run unit tests
        run: python -m pytest tests/unit

  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel, macos-26]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup Mamba
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          miniforge-variant: Miniforge3
          mamba-version: "*"
          auto-activate: true
          activate-environment: base
          conda-remove-defaults: true
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Install conda-build
        shell: bash -l {0}
        run: |
          mamba install -y \
            --override-channels \
            -c conda-forge \
            conda-build

      - name: Build and run regression tests
        shell: bash -l {0}
        run: |
          conda build conda-recipe \
            --override-channels \
            -c conda-forge \
            -c bioconda \
            --python 3.14 \
            --no-anaconda-upload

  pre-commit:
    name: Pre-commit
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install pre-commit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[pre-commit]

      - name: Run pre-commit
        run: |
          pre-commit install
          pre-commit run --all-files || {
            git status --short
            git diff
            exit 1
          }

  docs:
    name: Docs
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          make -C docs clean
          make -C docs html SPHINXOPTS="-W --keep-going"

      - name: Upload documentation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-html
          path: docs/build/html/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[testing]

      - name: Run coverage
        run: |
          python -m pytest tests/unit \
            --cov sist \
            --cov-report term-missing \
            --cov-report xml \
            -q

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          fail-on-error: false

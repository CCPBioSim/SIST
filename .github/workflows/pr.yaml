name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: sist
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      lowest-dependencies-check: true
      coverage-flag: python
      timeout-minutes: 15

  cpp-coverage:
    name: C++ coverage
    uses: CCPBioSim/.github/.github/workflows/ci-test-cpp-coverage.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      conda-packages: irf>=3.09,<3.10
      channels: conda-forge,bioconda
      build-command: |
        make -C src/trans_three clean
        make -C src/trans_three coverage
        make -C src/trans_compete clean
        make -C src/trans_compete coverage
      pre-test-command: |
        export CONDA_BUILD_STATE=TEST
        export SIST_TRANS_THREE_BIN="${GITHUB_WORKSPACE}/src/trans_three/qsidd"
        export SIST_TRANS_COMPETE_BIN="${GITHUB_WORKSPACE}/src/trans_compete/qsidd"
      test-path: tests/regression
      pytest-args: -vv
      filters: |
        src/trans_three/.*
        src/trans_compete/.*
      gcovr-args: --gcov-ignore-parse-errors=suspicious_hits.warn

  coverage:
    name: Coverage
    needs: [unit, cpp-coverage]
    uses: CCPBioSim/.github/.github/workflows/ci-coveralls-finish.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read

  regression:
    name: Regression
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      channels: conda-forge,bioconda
      python-versions: '["3.14"]'
      timeout-minutes: 60

  docs:
    name: Docs
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      requirements-file: docs/requirements.txt
      build-dir: build
      timeout-minutes: 20

  pre-commit:
    name: Pre-commit
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

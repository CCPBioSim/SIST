name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-python.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: sist
      test-path: tests/unit
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      lowest-dependencies-check: true
      timeout-minutes: 15

  regression:
    name: Regression
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      os: '["ubuntu-26.04", "macos-26-intel", "macos-26"]'
      channels: conda-forge,bioconda
      python-versions: '["3.14"]'
      timeout-minutes: 60

  docs:
    name: Docs
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      requirements-file: docs/requirements.txt
      build-dir: build
      timeout-minutes: 20

  pre-commit:
    name: Pre-commit
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@edc3732fa8d31a58312ca784e65cad9bdfba9347 # 0.13.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15

[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "SIST"
dynamic = ["version"]
description = "Stress-Induced Structural Transitions in superhelical DNA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.85,<2.0",
    "beautifulsoup4>=4.12,<5.0",
]

authors = [
    { name = "Craig Benham", email = "cjbenham@ucdavis.edu" },
    { name = "Dina Zhabinskaya", email = "dzhabinskaya@ucdavis.edu" },
    { name = "Sally Madden" },
    { name = "Richard M. Fye" },
    { name = "Victor Velasco-Berrelleza", email = "v.velascoberrelleza@sheffield.ac.uk" },
    { name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk" },
    { name = "Sarah Harris", email = "sarah.harris@sheffield.ac.uk" },
    { name = "James Gebbie-Rayet", email = "james.gebbie@stfc.ac.uk" },
]

maintainers = [
    { name = "Harry Swift", email = "harry.swift@stfc.ac.uk" },
]

[project.urls]
Repository = "https://github.com/CCPBioSim/SIST"

[project.scripts]
sist = "sist.cli:main"

[project.optional-dependencies]
testing = [
    "pytest>=9.0,<10.0",
    "mypy>=1.14,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sist*"]

[tool.setuptools.dynamic]
version = { attr = "sist.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "regression: end-to-end regression tests against reference outputs",
    "slow: long-running tests excluded from the default test suite",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["sist"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["Bio.*", "bs4.*"]
ignore_missing_imports = true
